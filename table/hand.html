<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Divinci Table — your hand</title>
<link rel="stylesheet" href="/assets/brand.css">
<style>
:root{--bg:#040d12;--panel:#0d1d25;--line:#d9b46a33;--ink:#ece4cf;--dim:#9fb0b0;--gold:#d9b46a;--gold-hi:#f4dc9b;--gold-lo:#8a6a2e;--teal:#3fd0c9;--warn:#ffb38f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.4 system-ui,-apple-system,sans-serif;
  background:radial-gradient(800px 500px at 50% -80px,#16465a 0%,transparent 70%),var(--bg)}
main{max-width:760px;margin:0 auto;padding:14px 16px 80px}
h1{font:900 21px Cinzel,Georgia,serif;letter-spacing:.06em;margin:4px 0 2px;color:var(--gold-hi)}
.sub{color:var(--dim);font-size:14px}
.panel{background:var(--panel);border-radius:12px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line);margin:12px 0}
.panel h2{font:700 13px Cinzel,Georgia,serif;letter-spacing:.12em;color:var(--gold);margin:0 0 8px;text-transform:uppercase}
.alert{background:#3a2a10;box-shadow:inset 0 0 0 2px var(--gold);border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:600}
button{font:600 15px system-ui;border-radius:8px;border:1px solid #d9b46a55;background:#10242d;color:var(--ink);padding:8px 12px;cursor:pointer;margin:3px 4px 3px 0}
button.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));color:#1a1206;border-color:var(--gold-lo)}
button:disabled{opacity:.4;cursor:default}
select{padding:7px;border-radius:8px;background:#071820;color:var(--ink);border:1px solid #d9b46a55;font:15px system-ui}
.mull-hand{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.mull-c{flex:1 1 130px;max-width:190px;min-height:64px;padding:8px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;user-select:none}
.mull-c img{width:100%;border-radius:7px;display:block;margin-bottom:4px;pointer-events:none}.mull-c *{pointer-events:none}.mull-c.sel{box-shadow:inset 0 0 0 3px #ff6b5e;opacity:.6}
.mull-row{display:flex;flex-wrap:wrap;gap:10px;position:sticky;top:calc(var(--tb-h,0px));z-index:55;background:var(--panel);padding:8px 0}.mull-row button{flex:1 1 150px;min-height:52px;font-size:17px}
.mull-c img{max-height:150px;object-fit:cover;object-position:top}@media (max-width:700px){.mull-c{flex:1 1 92px;max-width:32%;padding:5px;font-size:13px}.mull-c img{max-height:96px}}
.card{padding:9px 0;border-bottom:1px solid #ffffff10;overflow:auto}.card:last-child{border:0}
.card b{color:var(--gold-hi)}.card .t{color:var(--dim);font-size:13.5px}.card .x{font-size:13.5px;color:#cfdcdc;margin:3px 0}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:#ffffff14;margin-left:4px}
.life{font:800 28px ui-monospace,Menlo,monospace}
#err{color:var(--warn);min-height:1.2em}
#log{max-height:180px;overflow:auto;font-size:14px;color:#cfdcdc}

/* the hand, fanned like cards held in your fingers (wide screens; a phone keeps the list below) */
#fanpanel{display:none;overflow:visible}
#fan{position:relative;height:calc(var(--fw,170px) * 1.4 + 20px);margin-top:6px}
#fanpanel{background:none!important;border:0!important;box-shadow:none!important;padding:0 4px!important;margin-top:4px}
#fanpanel h2{margin:0;opacity:.7}
.fc{position:absolute;bottom:6px;width:var(--fw,170px);aspect-ratio:5/7;transform-origin:50% 190%;cursor:pointer}
.fi{width:100%;height:100%;border-radius:9px;overflow:hidden;background:#10242d;transform-origin:50% 190%;box-shadow:0 6px 14px #000a;
  transition:transform .18s ease,box-shadow .18s ease}
.fc img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
#fan .fc{touch-action:none;-webkit-user-drag:none;user-select:none}
.fc.txt .fi{padding:8px;font-size:11px;line-height:1.25;color:#ece4cf;border:1px solid #d9b46a55}.fc.txt b{display:block;color:#f4dc9b;font-size:12.5px}
.fc.ok .fi{box-shadow:0 0 0 2px #3fd0c9,0 0 16px #3fd0c988,0 6px 14px #000a}
.fc.land .fi{box-shadow:0 0 0 2px #6fd07a,0 0 16px #6fd07a88,0 6px 14px #000a}
/* the lift happens on the inner card, so the cursor's hit box never moves out from under it (no flicker at the edge) */
.fc:hover,.fc.sel{z-index:200!important}
.fc:hover .fi,.fc.sel .fi{transform:rotate(calc(var(--r) * -1)) translateY(-78px) scale(1.2)}
.fc.sel .fi{box-shadow:0 0 0 3px #f4dc9b,0 10px 24px #000c}
#fanact{min-height:46px;margin-top:54px;position:relative;z-index:400;background:linear-gradient(#0d1d25f2,#0d1d25f2);padding-top:6px;border-radius:8px}#fanact .nm{font-weight:700;color:#f4dc9b}#fanact .x{font-size:13px;color:#cfdcdc;margin:3px 0 6px;max-width:720px}

.paywith{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0 2px}.paywith button{min-height:44px;padding:6px 14px}
/* 2026-11-13 retro (B1): the cast panel always has a way out; (B3) a tapped source is shown, greyed, where the player chooses what pays */
#fanact .fanx{float:right;margin:0 0 6px 10px;min-height:40px;padding:6px 12px;font-weight:700}
.payg.tapped{opacity:.62}.payg.tapped .payn b{text-decoration:line-through;text-decoration-color:#ffb38f}.payg.tapped .payt{color:#ffb38f;font-size:13px;white-space:nowrap}
.payg.tapped button{width:auto;font-size:13px;padding:4px 10px;min-height:40px}
#handtoast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--hud-h,50px) + 14px);z-index:9700;display:none;max-width:min(560px,94vw);background:#10242cf7;color:#f1ecd8;
  border:1px solid #d9b46a;border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px #000c;font-weight:600}
#handtoast button{margin-left:10px;min-height:40px}
/* (B2) a choice or a surveil the table is waiting on is never painted under the cast panel or the fan */
#choicepanel,#effpanel,#mullpanel,#heldbox,#alert{position:relative;z-index:360}
.paypiles{margin:4px 0 8px;padding:8px;border-radius:10px;background:#ffffff08;box-shadow:inset 0 0 0 1px var(--line)}
.payg{display:flex;align-items:center;gap:8px;min-height:48px}.payg .payn{flex:1;min-width:0}.payg button{width:48px;min-height:44px;font-size:22px;padding:0;margin:0}.payk{min-width:1.6em;text-align:center;font:800 18px ui-monospace,Menlo,monospace}
.payc{display:inline-flex;gap:2px;min-width:30px}.pmp{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font:800 12px system-ui;border:1px solid #0008}
#swapbar{position:fixed;left:8px;right:8px;bottom:calc(var(--hud-h,0px) + 8px);z-index:9400}#swapbar button{display:block;width:100%;margin:0;min-height:48px;font-size:16px;background:#2a1f10;border-color:var(--gold)}
@media (min-width:700px){#swapbar{left:auto;right:12px;width:320px;bottom:calc(var(--hud-h,0px) + 12px)}}
/* H2: the pinned Attack control and the declare-attackers sheet (phones; wide screens keep the mat) */
#atkpin{display:none}
.as-pinsub{font-size:13px;color:#ffd9c2;margin-top:2px;text-align:center}
.as-status{font:700 17px system-ui;text-align:center;padding:4px 6px}
#atksheet{position:fixed;inset:0;z-index:9997;background:#000c;display:none;align-items:stretch;justify-content:center}
.as-box{display:flex;flex-direction:column;width:min(560px,100%);height:100%;background:var(--bg);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.as-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font:800 19px Cinzel,Georgia,serif;color:var(--gold-hi)}
.as-head button{min-height:44px}
.as-list{flex:1;overflow:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.as-row{display:flex;gap:12px;align-items:flex-start;min-height:64px;padding:12px;margin:8px 0;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.as-row.sel{box-shadow:inset 0 0 0 3px var(--gold);background:#1b2a1e}
.as-row.no{opacity:.62;cursor:default}
.as-tick{font-size:30px;line-height:1}
.as-body{flex:1;min-width:0}.as-body b{color:var(--gold-hi);font-size:17px}
.as-why{color:var(--warn);font-size:14px}
.as-none{padding:12px;border-radius:12px;background:#3a2a10;box-shadow:inset 0 0 0 2px var(--gold);margin-bottom:8px}
.as-targets{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.as-targets button{flex:1 1 40%;min-height:48px}
.as-foot{padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.as-foot button{display:block;width:100%;margin:6px 0 0}
button.big{min-height:52px;font-size:17px}
@media (max-width:700px){
  #atkpin.on{display:block;position:fixed;left:8px;right:8px;bottom:calc(var(--hud-h,0px) + 8px);z-index:9400;padding:8px;border-radius:14px;background:#0d1d25f5;box-shadow:0 0 0 2px var(--gold),0 8px 24px #000c}
  #atkpin button{display:block;width:100%;margin:0;min-height:56px;font-size:19px}
  main{padding-bottom:calc(80px + var(--pin-h,0px))}
  body.as-open{overflow:hidden}
  main button,#matgy button{min-height:44px}
  .atkbox{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 8px 0 2px}.atkbox input{width:24px;height:24px}
  #steprow button{min-height:48px;padding:8px 14px}
}
@media (min-width:700px){#fanpanel{display:block}#handpanel{display:none}}
/* ── the playmat (wide screens): the opponent's side mirrored on top, yours below, piles at the side, hand fan underneath ── */
#matpanel{display:none;padding:10px}
.mat{background:radial-gradient(1200px 500px at 50% 50%,#173847 0%,#0b1a21 70%);border:1px solid #d9b46a33;border-radius:14px;padding:10px}
.half{display:grid;grid-template-columns:92px 1fr 210px;gap:8px;align-items:start}
.half .piles{grid-column:1;grid-row:1/span 2;display:flex;flex-direction:column;gap:8px;align-items:center}
.half .others{grid-column:3;grid-row:1/span 2;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:100px;padding:6px;border-radius:10px;background:#ffffff05}
.half.opp .lands,.half.me .crea{grid-column:2;grid-row:1}.half.opp .crea,.half.me .lands{grid-column:2;grid-row:2}
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:116px;padding:6px 8px;border-radius:10px;background:#ffffff06}
.mlab{font:700 10.5px system-ui;letter-spacing:.1em;color:#9fb0b0;text-transform:uppercase;width:100%;margin:-2px 0 2px}
.mc{position:relative;width:76px;aspect-ratio:5/7;border-radius:6px;cursor:pointer;transition:transform .15s,margin .15s;flex:0 0 auto}
.mc img{width:100%;height:100%;border-radius:6px;display:block;box-shadow:0 3px 8px #000a;pointer-events:none}
.mc .tx{width:100%;height:100%;border-radius:6px;background:#10242d;border:1px solid #d9b46a55;font-size:9.5px;line-height:1.15;padding:4px;color:#ece4cf;overflow:hidden}
.mc.tapped{transform:rotate(90deg);margin:0 16px}.mc.sel{outline:2px solid #f4dc9b;outline-offset:2px}
.mc.atk{outline:2px solid #ff6b4a;outline-offset:2px}.mc.atk:not(.tapped){transform:translateY(-10px)}
.mc .bd{position:absolute;font:800 10.5px system-ui;padding:1px 5px;border-radius:6px;background:#000c;color:#fff}
.mc .pt{right:2px;bottom:2px;background:#f4dc9bee;color:#111}
.mc .cbs{position:absolute;left:2px;top:22%;display:flex;flex-direction:column;gap:2px;align-items:flex-start;max-width:calc(100% - 4px);z-index:3}
.mc .cbs.noart{top:52%}.mc .cbs span{font:800 10px/1.25 system-ui;padding:1px 5px;border-radius:6px;color:#fff;border:1px solid #0007;white-space:nowrap;box-shadow:0 1px 3px #000a}.mc .ct{left:2px;bottom:2px;background:#2a6;}.mc .zz{left:2px;top:2px}
.pile{width:76px;aspect-ratio:5/7;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 15px system-ui;color:#f4dc9b;cursor:default;
  background:repeating-linear-gradient(45deg,#1a2f3a,#1a2f3a 6px,#213a47 6px,#213a47 12px);border:1px solid #d9b46a55;box-shadow:0 3px 8px #000a}
.pile small{font:600 10px system-ui;color:#9fb0b0}.pile.gy{cursor:pointer;background:#0e1b22;position:relative;overflow:hidden}.pile.gy img{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.pile.gy span{position:relative}
.pile.ex{cursor:pointer;background:#1a1330;position:relative;overflow:hidden;border-color:#b79bff88}.pile.ex img{position:absolute;inset:0;width:100%;height:100%;opacity:.6}.pile.ex span,.pile.ex small{position:relative;text-align:center;padding:0 3px}.pile.ex .nm{font:700 11px system-ui;line-height:1.15;word-break:break-word}
.bline{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0;padding:6px;border-top:1px dashed #d9b46a44;border-bottom:1px dashed #d9b46a44;min-height:30px;color:#9fb0b0;font-size:13px}
.ohead{display:flex;justify-content:space-between;color:#cfdcdc;font-size:13px;margin:0 2px 6px}.ohead b{color:#f4dc9b}
#matpop{position:fixed;z-index:9000;display:none;background:#0d1d25f5;border:1px solid #d9b46a66;border-radius:10px;padding:8px;box-shadow:0 10px 30px #000c;max-width:260px}
#matpop .nm{font-weight:700;color:#f4dc9b;margin-bottom:4px}#matpop button{margin:3px 4px 0 0}
#matgy{position:fixed;inset:0;z-index:9500;background:#000b;display:none;align-items:center;justify-content:center;padding:calc(var(--tb-h,52px) + 8px) 0 calc(var(--hud-h,50px) + 8px)}
#matgy .box{background:#0d1d25;border:1px solid #d9b46a66;border-radius:12px;padding:12px;max-width:min(860px,94vw);max-height:100%;overflow:auto}
@media (min-width:900px){#matpanel{display:block}#fieldpanel,#oppspanel{display:none}}


/* Arena-style on a wide screen: the hand is fixed along the bottom, over the battlefield; cards peek up and rise when pointed at */
@media (min-width:900px){
  #fanpanel{position:fixed!important;left:0;right:0;bottom:var(--hud-h,50px);height:calc(var(--fw,170px) * 1.05);z-index:300;pointer-events:none;margin:0!important}
  #fanpanel h2{display:none}
  #fan{height:calc(var(--fw,170px) * 1.05)!important;margin-top:0!important;pointer-events:none}
  #fan .fc{pointer-events:auto;bottom:calc(var(--fw,170px) * -0.38)}
  #fanact{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--hud-h,50px) + var(--fw,170px) * 1.1);width:min(760px,92vw);z-index:350;pointer-events:auto;
    box-shadow:0 8px 24px #000b;border:1px solid #d9b46a55;padding:8px 12px!important;
    max-height:calc(100vh - var(--hud-h,50px) - var(--fw,170px) * 1.1 - var(--tb-h,52px) - var(--ca-h,0px) - 16px);overflow:auto}
  #matpanel{margin-bottom:calc(var(--fw,170px) * 1.05)}
}
/* drag a card from the hand onto the battlefield (as in Arena) */
.fghost{position:fixed;z-index:9600;width:150px;aspect-ratio:5/7;pointer-events:none;border-radius:9px;overflow:hidden;box-shadow:0 14px 34px #000c;transform:translate(-50%,-60%) rotate(-3deg) scale(1.05)}
.fghost img{width:100%;height:100%;display:block}
/* the battle line (2026-11-13): declared attackers and blockers step out of their rows to the line; a blocker stands opposite its attacker */
.canvas .mc.bl{z-index:410}
.canvas .mc.bl-atk{outline:2px solid #ff6b4a;outline-offset:2px}
.canvas .mc.bl-unb{outline:3px solid #ff3b1f;outline-offset:2px;box-shadow:0 0 18px #ff3b1fcc}
.canvas .mc.bl-blkd{outline:2px solid #d9b46a;outline-offset:2px}
.canvas .mc.bl-blk{outline:2px solid #6fb7ff;outline-offset:2px}
.canvas .blb{position:absolute;z-index:420;transform:translateX(-50%);pointer-events:none;white-space:nowrap;font:800 10.5px system-ui;padding:1px 6px;border-radius:7px;color:#fff;background:#8a3a1e;box-shadow:0 1px 4px #000a}
.canvas .blb.unb{background:#d32a12}.canvas .blb.blk{background:#2a5d92}.canvas .blb.blkd{background:#7a5a1a}
@keyframes blmove{from{translate:var(--bx,0px) var(--by,0px)}to{translate:0px 0px}}
.canvas .mc.bl-move{animation:blmove .28s ease-out}
@media (prefers-reduced-motion:reduce){.canvas .mc.bl-move{animation:none}}
#blstrip:empty{display:none}
#blstrip{margin:0 0 10px;padding:8px;border-radius:10px;border:1px dashed #d9b46a66;background:#10242d}
#blstrip .blh{font:700 11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:#9fb0b0;margin-bottom:6px}
#blstrip .bllanes{display:flex;flex-wrap:wrap;gap:8px}
#blstrip .bllane{flex:1 1 150px;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:8px;background:#0b1a21;border:1px solid #ff6b4a55}
#blstrip .bllane.unb{border-color:#ff3b1f;box-shadow:0 0 10px #ff3b1f77}
#blstrip .blc{padding:5px 7px;border-radius:7px;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
#blstrip .blc small{display:block;opacity:.8;font-size:11px}
#blstrip .blc.atk{background:#5a2416;color:#ffe4d9}#blstrip .blc.blk{background:#1d3f63;color:#dcebff;margin-left:14px}
#blstrip .blnote{font-size:12px;color:#ffb38f;margin-left:14px}
/* equip by drag or by tap (2026-11-13): creatures the Equipment may go onto light up; the one under the pointer lights up solid */
.mc.eqdrop,#field .card.eqdrop{outline:3px dashed #6fd07a;outline-offset:2px;box-shadow:0 0 16px #6fd07a99;cursor:copy}
.mc.eqover,#field .card.eqover{outline:4px solid #9ff0a8;box-shadow:0 0 22px #9ff0a8}
#field .card.eqover{background:#163c32}
.eqgrip{display:inline-block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;padding:9px 12px;margin:4px 4px 2px 0;min-height:22px;border:1px dashed #d9b46a;border-radius:9px;font:600 13px system-ui;color:#f4dc9b;background:#2a2212}
.eqgrip:focus-visible{outline:2px solid #f4dc9b}
.eqghost{position:fixed;z-index:9600;pointer-events:none;transform:translate(-50%,-135%);padding:7px 11px;border-radius:9px;background:#7a5a1a;color:#fff;font:700 13px system-ui;box-shadow:0 8px 20px #000c;white-space:nowrap}
body.eqdragging{cursor:grabbing}
body.fdragging .canvas{outline:3px dashed #3fd0c9;outline-offset:-6px}
body.fdragging.fdrop .canvas{outline-color:#6fd07a;background-color:#163c32}
/* the canvas: full width on a wide screen; cards placed by zone, then wherever you drag them (saved on this device) */
@media (min-width:900px){main{max-width:none!important;padding-left:14px!important;padding-right:14px!important}}
.canvas{position:relative;height:max(660px,calc(100vh - var(--tb-h,52px) - var(--hud-h,50px) - 70px));border-radius:14px;overflow:hidden;
  background:radial-gradient(1400px 700px at 50% 50%,#173847 0%,#0b1a21 72%);border:1px solid #d9b46a33;touch-action:none}
.canvas .mc{position:absolute;width:var(--cw);margin:0;user-select:none}.canvas .mc.tapped{margin:0}
.canvas .mc.drag{z-index:500;opacity:.9;cursor:grabbing;transition:none}
.canvas .pile{position:absolute;width:var(--cw)}
.canvas .lstack{position:absolute;z-index:1}.canvas .lstack.drag{z-index:500;opacity:.9;cursor:grabbing}
.canvas .lstack .cnt{position:absolute;right:-6px;top:-10px;z-index:60;min-width:30px;min-height:26px;padding:2px 7px;margin:0;border-radius:999px;font:800 13px system-ui;background:#d9b46a;color:#1a1408;border:1px solid #1a1408;cursor:pointer}
.canvas .zl{position:absolute;font:700 11px system-ui;letter-spacing:.12em;color:#9fb0b066;text-transform:uppercase;pointer-events:none}
.canvas .mid{position:absolute;left:0;right:0;top:calc(41% - 20px);height:40px;display:flex;align-items:center;justify-content:center;gap:10px;
  border-top:1px dashed #d9b46a44;border-bottom:1px dashed #d9b46a44;color:#9fb0b0;font-size:13px;z-index:400}
.canvas .tidy{position:absolute;right:10px;top:8px;z-index:450}.canvas .who{position:absolute;left:12px;font-size:13px;color:#cfdcdc;z-index:450}.canvas .who b{color:#f4dc9b}


#stepbar{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px;font:600 11px system-ui,sans-serif}
#stepbar span{padding:3px 7px;border-radius:999px;background:#ffffff0f;color:#9fb0b0;white-space:nowrap}
#stepbar span.done{color:#6d7c7c}
#stepbar span.now{background:#d9b46a;color:#1a1408}

<script>

// ── surveil / scry from an "enters" trigger happen once: hide the button after it was used ──
const effKey = () => "effused:" + (me() || "");

try { effUsedIds = new Set(JSON.parse(localStorage.getItem(effKey()) || "[]")); } catch {}
const effOnce = p => /\bwhen (this|it)\b[^]*?\benters\b[^]*?\b(surveil|scry) 1\b/i.test(p.text || "");

function effMarkUsed(id) { effUsedIds.add(String(id)); try { localStorage.setItem(effKey(), JSON.stringify([...effUsedIds])); } catch {} }
(async () => {                                             // uses before this page loaded: "<card>: I surveil 1 …" said by me in the game log
  try { const d = await (await fetch("/api/events?since=0")).json();
    for (const e of d.events || []) { const m = e.type === "say" && e.speaker === me() && /^(.+?): I (surveil|scry) 1/.exec(e.text || ""); if (m) effUsedNames.add(m[1]); }

// "Choose one —" cards: one Cast button per mode (the engine needs the mode number, 1-based)
function modesOf(c) {

  if (c.type && !/\b(Instant|Sorcery)\b/.test(c.type)) return [];   // a permanent's "when this enters, choose one": the table asks when it enters (a choice), not the Cast button

}

// ── a mana pool you fill by hand: tap your own sources (it really taps them); Cast first returns them, then pays (same mana) ──
let MPOOL = { key: "", items: [] };
const poolKey = () => "mpool:" + (S && S.seat || "");
const stepKey = () => (PH ? `${PH.player}|${PH.step}` : "");
function poolLoad() { try { MPOOL = JSON.parse(localStorage.getItem(poolKey()) || '{"key":"","items":[]}'); } catch { MPOOL = { key: "", items: [] }; }
  if (MPOOL.key !== stepKey()) MPOOL = { key: stepKey(), items: [] };            // mana empties when the step ends

function colorsOf(p) {                                         // what a source can make, from its text

}
const isManaSrc = p => /\{T\}[^:]*: Add /.test((p.text || "").replace(/"[^"]*"/g, "")) || colorsOf(p).length > 0 && /\bLand\b/.test(p.type || "");
async function poolTap(p, color) {

  poolLoad(); MPOOL.items.push({ id: p.id, color, name: p.name }); poolSave(); window.TableSfx && TableSfx.fx("tap"); matSig = ""; draw(); offerUndo(p, "tap");
}
