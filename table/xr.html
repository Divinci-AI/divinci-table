<style>

    display: flex; gap: 10px; align-items: center; padding: 10px 12px 10px 18px; border-radius: 999px;
    background: #000b; backdrop-filter: blur(8px); pointer-events: auto; max-width: calc(100vw - 32px); }

    color: #140d06; font-weight: 800; font-size: 16px; }

    padding: 8px 14px; border-radius: 999px; background: #000a; font-size: 14px; color: var(--dim); white-space: nowrap; }
  #ios { position: fixed; left: 16px; right: 16px; top: 16px; display: none; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #ios a { display: block; width: 120px; text-align: center; color: var(--ink); text-decoration: none; font-size: 13px; }
  #ios img { width: 120px; height: 120px; object-fit: cover; border-radius: 16px; background: #ffffff14; display: block; }
  #msg { position: fixed; top: 16px; right: 16px; font-size: 12px; color: var(--dim); max-width: 50vw; text-align: right; }
  #XRButton, button.webxr { font-family: inherit !important; }
</style>
<script>
  addEventListener("error", e => { const m = document.getElementById("msg"); if (m) m.textContent = "⚠ " + (e.message || e.error); });
  addEventListener("unhandledrejection", e => { const m = document.getElementById("msg"); if (m) m.textContent = "⚠ " + e.reason; });
</script>

</head>
<body>
<div id="overlay">
  <div id="hint">Point at the table, then tap to place it</div>
  <div id="bar"><span class="ph" id="ph">—</span><button id="back" title="back a step" style="opacity:.75">◂</button><button id="next">NEXT ▸</button></div>
</div>
<div id="ios"></div>
<div id="msg"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "/vendor/jsm/loaders/GLTFLoader.js";

import { RoomEnvironment } from "/vendor/jsm/environments/RoomEnvironment.js";

// ── the same decks → models → colours as the stage ─────────────────────────────────────────
const LOOKS = [

  { match: /kaust/i,    accent: "#d8b45a", model: "Fusion" },
  { match: /kilo/i,     accent: "#5fd3ff", model: "Michael" },

const lookFor = s => LOOKS.find(l => l.match.test(s?.commander || "")) || { accent: "#e6e6e6", model: s?.name };

const POOLS = { idle: ["idle", /^Idle_0?2$/, /^Idle_5$/], talk: ["talk", /Talk_with_Hands_Open/],
  think: ["think", /Look_Around/], cast: [/spell|cast/i], hurt: [/Hit_Reaction/], win: ["cheer", /Fist_Pump/],

// ── renderer, XR ─────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

scene.add(new THREE.HemisphereLight(0xffffff, 0x302820, 0.6));
const sun = new THREE.DirectionalLight(0xfff1e0, 2); sun.position.set(1, 3, 1.5); sun.castShadow = true;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0, 1.6, 2.4);
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// the table: everything lives in this group, placed by hit-test in AR, in front of you in VR
const table = new THREE.Group(); scene.add(table);

const top = new THREE.Mesh(new THREE.CylinderGeometry(TABLE_R * 0.62, TABLE_R * 0.62, 0.06, 64),
  new THREE.MeshStandardMaterial({ color: 0x3a2a1c, roughness: 0.7 }));

const shadowCatcher = new THREE.Mesh(new THREE.CircleGeometry(TABLE_R * 1.6, 48), new THREE.ShadowMaterial({ opacity: 0.3 }));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.receiveShadow = true; table.add(shadowCatcher);

const ar = navigator.xr && await navigator.xr.isSessionSupported("immersive-ar").catch(() => false);
const vr = navigator.xr && await navigator.xr.isSessionSupported("immersive-vr").catch(() => false);
if (ar) document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ["hit-test"],
  optionalFeatures: ["dom-overlay"], domOverlay: { root: document.getElementById("overlay") } }));
if (vr) document.body.appendChild(VRButton.createButton(renderer));
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
document.getElementById("hint").textContent = ar ? "Tap ‘Start AR’, point at the table, then tap to place it"
  : vr ? "Tap ‘Enter VR’" : isIOS ? "Tap an avatar to see it in your room" : !isSecureContext
  ? "AR/VR needs HTTPS: open this page on the table's https:// address" : "No AR/VR on this device — this is the preview";

// AR: a reticle on real surfaces; a tap places (or moves) the table, a mini table ~25 cm across
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffffff })); reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
let hitSource = null, placed = false;
renderer.xr.addEventListener("sessionstart", async () => {
  const s = renderer.xr.getSession();
  if (s.environmentBlendMode && s.environmentBlendMode !== "opaque") {     // AR: tabletop size, wait for a tap
    table.scale.setScalar(0.14); table.visible = false; placed = false; top.visible = false;   // the real table is there
    const space = await s.requestReferenceSpace("viewer");
    hitSource = await s.requestHitTestSource?.({ space });
  } else {                                                                  // VR: life-size, in front of you
    table.scale.setScalar(1); table.position.set(0, 0, -2.2); table.visible = true;
  }
});
renderer.xr.addEventListener("sessionend", () => { hitSource = null; table.visible = true; top.visible = true; table.scale.setScalar(1); table.position.set(0, 0, 0); });
const controller = renderer.xr.getController(0); scene.add(controller);
controller.addEventListener("select", () => {
  if (!reticle.visible) return;
  table.position.setFromMatrixPosition(reticle.matrix); table.visible = true; placed = true;
  document.getElementById("hint").textContent = "Tap again to move the table";
});

// ── seats ────────────────────────────────────────────────────────────────────────────────
const loader = new GLTFLoader(), cache = {};
const load = f => cache[f] ||= new Promise((ok, bad) => loader.load(`/avatars/${encodeURIComponent(f)}.glb`, ok, undefined, bad));
let models = new Set(), seats = [], order = [], turn = null, passNext = null, cursor = "latest";
const actors = {};                                          // name → {group, mixer, actions, ...}
const _v = () => new THREE.Vector3(), _q = () => new THREE.Quaternion();

function label(text, color) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 128;
  const g = c.getContext("2d"); g.fillStyle = "rgba(0,0,0,0.55)"; g.beginPath(); g.roundRect(8, 8, 496, 112, 56); g.fill();
  g.fillStyle = color; g.font = "bold 56px system-ui"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 256, 66);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false })); sp.scale.set(0.62, 0.155, 1); sp.renderOrder = 10;
  return sp;
}
const backTex = (() => { const c = document.createElement("canvas"); c.width = 128; c.height = 178; const g = c.getContext("2d");
  g.fillStyle = "#4a3020"; g.fillRect(0, 0, 128, 178); g.strokeStyle = "#c9a35f"; g.lineWidth = 3;
  g.beginPath(); g.ellipse(64, 89, 40, 62, 0, 0, Math.PI * 2); g.stroke();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
function fan(n) {
  const g = new THREE.Group(), geo = new THREE.PlaneGeometry(0.42, 0.59), m = new THREE.MeshStandardMaterial({ map: backTex, side: THREE.DoubleSide });
  for (let i = 0; i < n; i++) { const p = new THREE.Group(); p.rotation.z = -((n === 1 ? 0 : i / (n - 1)) - 0.5) * Math.min(1.4, 0.16 * n);
    const c = new THREE.Mesh(geo, m); c.position.set(0, 0.27, i * 0.004); p.add(c); g.add(p); }
  g.scale.setScalar(0.55); g.userData.n = n; return g;
}
function rotateWorld(b, q) { const pq = b.parent.getWorldQuaternion(_q()); b.quaternion.premultiply(pq.clone().invert().multiply(q).multiply(pq)); b.updateMatrixWorld(true); }
function solveArm(arm, target, pole) {                       // the same two-bone IK as the stage
  const a = arm.upper.getWorldPosition(_v()), b = arm.lower.getWorldPosition(_v()), c = arm.hand.getWorldPosition(_v());
  const l1 = a.distanceTo(b), l2 = b.distanceTo(c), d = Math.min(a.distanceTo(target), (l1 + l2) * 0.999);
  const ba = a.clone().sub(b), bc = c.clone().sub(b);
  const axis = _v().crossVectors(ba, bc); if (axis.lengthSq() < 1e-10) axis.set(1, 0, 0); axis.normalize();
  rotateWorld(arm.lower, _q().setFromAxisAngle(axis, Math.acos(THREE.MathUtils.clamp((l1 * l1 + l2 * l2 - d * d) / (2 * l1 * l2), -1, 1)) - ba.angleTo(bc)));
  const c2 = arm.hand.getWorldPosition(_v());
  rotateWorld(arm.upper, _q().setFromUnitVectors(c2.sub(a).normalize(), target.clone().sub(a).normalize()));
  const ax = target.clone().sub(a).normalize(), e = arm.lower.getWorldPosition(_v()).sub(a), p = pole.clone().sub(a);
  e.sub(ax.clone().multiplyScalar(e.dot(ax))); p.sub(ax.clone().multiplyScalar(p.dot(ax)));
  if (e.lengthSq() > 1e-10 && p.lengthSq() > 1e-10) rotateWorld(arm.upper, _q().setFromUnitVectors(e.normalize(), p.normalize()));
}

async function seatActor(s, i, n) {
  const look = lookFor(s), base = models.has(look.model + ".v2") ? look.model + ".v2" : models.has(look.model) ? look.model : null;
  const holder = new THREE.Group();
  const ang = (i / n) * Math.PI * 2 + Math.PI / 2;
  holder.position.set(Math.cos(ang) * TABLE_R, 0, Math.sin(ang) * TABLE_R);
  holder.lookAt(0, 0, 0);
  table.add(holder);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.025, 8, 48).rotateX(Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: look.accent, emissive: look.accent, emissiveIntensity: 1.5 }));
  ring.position.y = 0.02; ring.visible = false; holder.add(ring);
  const a = { ang, holder, ring, look, name: s.name, pool: "idle", hold: 1, seed: Math.random() * 10, nextIdle: 0, onceUntil: 0, life: s.life, hand: s.hand };
  actors[s.name] = a;
  a.tag = label(`${s.name} · ${s.life}`, look.accent); a.tag.position.y = 2.15; holder.add(a.tag);
  if (!base) { const pill = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 1.0, 6, 16), new THREE.MeshStandardMaterial({ color: look.accent })); pill.position.y = 0.8; holder.add(pill); return; }
  const [gltf, ...more] = await Promise.all([load(base), ...[...models].filter(m => m.startsWith(base + ".more")).map(m => load(m).catch(() => null))]);
  const model = SkeletonUtils.clone(gltf.scene);
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  let head = null; const bone = nm => { let b = null; model.traverse(o => { if (!b && o.isBone && o.name === nm) b = o; }); return b; };
  head = bone("Head");
  model.updateMatrixWorld(true);
  const pts = []; model.traverse(o => { if (o.isBone) pts.push(o.getWorldPosition(_v())); });
  const bb = new THREE.Box3().setFromPoints(pts), topY = head ? head.getWorldPosition(_v()).y : bb.max.y;
  const k = 1.72 / ((topY - bb.min.y) || 1), c = bb.getCenter(_v());
  model.scale.multiplyScalar(k); model.position.set(-c.x * k, -bb.min.y * k, -c.z * k);
  holder.add(model);

  gltf.animations.forEach((clip, j) => { a.actions[CLIPS[j] || clip.name] = a.mixer.clipAction(clip); });
  for (const g of more) for (const clip of g?.animations || []) a.actions[clip.name] ||= a.mixer.clipAction(clip);

  if (!a.arm.upper) a.arm = null;

}
function pick(a, pool) {

  const f = POOLS[pool].map(p => typeof p === "string" ? (a.actions[p] ? p : null) : names.find(n => p.test(n))).filter(Boolean);
  return f.length ? f[Math.floor(Math.random() * f.length)] : null;
}
function play(a, poolOrClip, once = false) {

  const next = a.actions[clip], prev = a.actions[a.current]; if (a.current === clip) return;
  next.reset(); next.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat); next.clampWhenFinished = once;
  next.timeScale = 0.88 + Math.random() * 0.24; next.play(); if (prev) next.crossFadeFrom(prev, 0.3, true);

const act = (a, pool) => { if (a) { a.pool = pool; play(a, pool, true); } };

// ── the table's state: seats, life, hands, turn, speech ───────────────────────────────────
async function j(u, o) { const r = await fetch(u, o); return r.json(); }
async function build() {
  try { models = new Set(await j("/avatars/index.json")); } catch { models = new Set(); }
  seats = (await j("/api/stage")).seats;
  try { const p = await j("/api/phase"); order = p.order || []; turn = p.player; } catch { order = []; }
  const ordered = order.length ? order.map(n => seats.find(s => s.name === n)).filter(Boolean) : seats;
  await Promise.all(ordered.map((s, i) => seatActor(s, i, ordered.length)));
  iosLinks(ordered);
}
function iosLinks(list) {                                     // iPhone/Vision Pro: AR Quick Look, one avatar at a time
  if (!isIOS) return;
  const el = document.getElementById("ios"); el.style.display = "flex";
  el.innerHTML = list.map(s => { const m = lookFor(s).model + ".v2";
    return models.has(m) ? `<a rel="ar" href="/avatars/${encodeURIComponent(m)}.usdz"><img src="/avatars/${encodeURIComponent(m)}.png" alt="">${escHtml(s.name)}</a>` : ""; }).join("");
}
async function refresh() {
  try {
    const st = (await j("/api/stage")).seats;
    for (const s of st) { const a = actors[s.name]; if (!a) continue;
      if (s.life !== a.life) { a.life = s.life; a.holder.remove(a.tag); a.tag = label(`${s.name} · ${s.life}`, a.look.accent); a.tag.position.y = 2.15; a.holder.add(a.tag); }
      if (a.fan && s.hand !== a.fan.userData.n) { a.holder.remove(a.fan); a.fan = fan(s.hand); a.holder.add(a.fan); } }
  } catch {}
}
let phaseInfo = null;
async function phase() {
  try { phaseInfo = await j("/api/phase"); } catch { phaseInfo = null; }
  const p = phaseInfo, ph = document.getElementById("ph"), nb = document.getElementById("next");
  if (!p || p.error || !p.steps) { ph.textContent = "—"; nb.style.display = "none"; return; }
  turn = p.player;
  const waiting = (p.waiting || []).length && p.seconds_left > 0;
  ph.innerHTML = `<b>${escHtml(p.player || "—")}</b> · ${escHtml(p.step)}` + (waiting ? ` <span class="wait">· ${escHtml(p.waiting.join(", "))} ${Math.ceil(p.seconds_left)}s</span>` : "");
  const human = p.player && !(p.ai || []).includes(p.player);
  nb.style.display = human || !p.player ? "" : "none"; nb.disabled = !!waiting;
  document.getElementById("back").style.display = p.player ? "" : "none";
  passNext = p.passes?.next || null;
  const left = (p.passes?.need || []).filter(n => !(p.passes.passed || []).includes(n)).length;
  nb.textContent = !p.player ? "START ▸" : passNext && left > 1 ? `✋ ${passNext} passes` : p.index >= p.steps.length - 1 ? "END TURN ▸" : "NEXT ▸";

document.getElementById("back").addEventListener("click", async () => {
  await fetch("/api/phase/back", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ by: turn || "xr" }) });
  phase();
});
document.getElementById("next").addEventListener("click", async e => {
  e.stopPropagation();
  const go = confirm => fetch("/api/phase/next", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ by: passNext || turn || "xr", shared: true, confirm }) });
  const r = await go(false);
  if (r.status === 409) { const d = await r.json().catch(() => ({})); if (d.confirm && window.confirm(d.confirm)) await go(true); }

async function poll() {
  try {
    const r = await j(`/api/events?since=${cursor}`);
    if (cursor !== "latest" && !r.restarted) for (const e of r.events) {
      const a = actors[e.speaker] || actors[e.player];
      if (e.type === "say" && a) { a.talkUntil = performance.now() + Math.min(6000, 220 * (e.text || "").split(" ").length);
        if (e.action === "begin") act(a, "think"); else if (e.action === "cast") act(a, "cast");
        else if (e.action === "attack" || e.action === "damage") act(a, "win"); else if (e.action === "end") act(a, "done"); }
      if (e.type === "life" && a && e.delta) act(a, e.delta < 0 ? "hurt" : "react");
      if (e.type === "captain") { const c = actors[e.seat]; if (c) { c.talkUntil = performance.now() + 4000; act(c, "react"); }
        if (e.audio) new Audio(e.audio).play().catch(() => {}); }
      if (e.type === "life" || e.type === "hand" || (e.type === "say" && /draw|cast|land/.test(e.action || ""))) refresh();
      if (e.type === "say" || e.type === "board3d" || e.type === "board") boardRefresh();
    }
    cursor = r.last;
  } catch {}
  setTimeout(poll, 800);
}

// ── frame ────────────────────────────────────────────────────────────────────────────────
let last = performance.now();
renderer.setAnimationLoop((t, frame) => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (frame && hitSource && !placed) {                       // AR: find the real table under the reticle
    const hits = frame.getHitTestResults(hitSource);
    reticle.visible = hits.length > 0;
    if (hits.length) reticle.matrix.fromArray(hits[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix);
  } else if (placed) reticle.visible = false;
  if (!renderer.xr.isPresenting) {                           // preview: a slow orbit around the table
    if (topView) { camera.position.set(0, 2.6, 0.001); camera.lookAt(0, 0.75, 0); }
    else { const r = 4.6; camera.position.set(Math.sin(now / 9000) * r, 2.9, Math.cos(now / 9000) * r); camera.lookAt(0, 0.95, 0); }
  }
  for (const a of Object.values(actors)) {
    a.holder.visible = showAvatars && !(topView && !renderer.xr.isPresenting);   // top-down: the cards, not the heads
    if (!a.mixer) continue;
    a.mixer.update(dt);

    }
    if (a.arm && a.fan) {                                    // cards in the left hand, as on the stage

      const saved = [a.arm.upper.quaternion.clone(), a.arm.lower.quaternion.clone()];
      a.holder.updateMatrixWorld(true);
      solveArm(a.arm, a.holder.localToWorld(new THREE.Vector3(0.36, 1.22, 0.34)), a.holder.localToWorld(new THREE.Vector3(0.9, 0.7, -0.2)));
      a.arm.upper.quaternion.slerpQuaternions(saved[0], a.arm.upper.quaternion.clone(), a.hold);
      a.arm.lower.quaternion.slerpQuaternions(saved[1], a.arm.lower.quaternion.clone(), a.hold);
      a.holder.updateMatrixWorld(true);
      a.fan.position.copy(a.holder.worldToLocal(a.arm.hand.getWorldPosition(_v()))).add(new THREE.Vector3(0.03, -0.02, 0.06));
      a.fan.rotation.set(-0.15, -0.25, -0.22); a.fan.visible = a.hold > 0.35;
    }
  }
  renderer.render(scene, camera);
});

// ── every card in play, on the table in front of its owner ────────────────────────────────
const board = createBoard(THREE, { parent: table, y: 0.752, radius: TABLE_R * 0.62, angleOf: n => actors[n]?.ang,
  colorOf: n => actors[n]?.look.accent || "#e6e6e6" });
let boardBusy = false;
async function boardRefresh() {
  if (boardBusy) return; boardBusy = true;
  try { board.update(await j("/api/board3d")); } catch {} finally { boardBusy = false; }
}
// hover a card (desktop/phone preview): its name, type and text in a box; T: look straight down
const tip = document.createElement("div");
tip.style.cssText = "position:fixed;max-width:320px;padding:10px 12px;border-radius:10px;background:rgba(10,10,14,.88);color:#eee;font:13px/1.35 system-ui;pointer-events:none;display:none;z-index:9";
document.body.appendChild(tip);
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
addEventListener("pointermove", ev => {
  if (renderer.xr.isPresenting) return;
  ptr.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const c = board.pick(ray);
  if (!c) { tip.style.display = "none"; return; }
  tip.innerHTML = c.face_down ? `<b>A face-down ${escHtml(c.pt || "2/2")}</b>` + (c.how ? "<br>" + escHtml(c.how) : "") + (c.ward ? "<br>ward 2" : "")
    : `<b>${escHtml(c.name)}</b> ${escHtml(c.cost || "")}<br><i>${escHtml(c.type || "")}</i>${c.pt ? " · " + escHtml(c.pt) : ""}` +
      (c.tapped ? " · tapped" : "") + (c.counters ? ` · ${c.counters} counter(s)` : "") + (c.note ? `<br>${escHtml(c.note)}` : "") +
      (c.text ? `<br><span style="opacity:.85">${escHtml(c.text)}</span>` : "");
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - 340) + "px"; tip.style.top = Math.min(ev.clientY + 14, innerHeight - 160) + "px";
  tip.style.display = "block";
});
// The page's versions, as toggles (and in the URL, so a link opens the same way):
//   ?view=top  straight down at the cards     ?avatars=off  the board without the avatars
const qs = new URLSearchParams(location.search);
let topView = qs.get("view") === "top", showAvatars = qs.get("avatars") !== "off";
const bar = document.createElement("div");
bar.style.cssText = "position:fixed;top:10px;right:10px;display:flex;gap:6px;z-index:8;font:13px system-ui";
document.body.appendChild(bar);
const btnCss = "padding:6px 10px;border-radius:8px;border:1px solid #444;background:rgba(20,20,26,.85);color:#eee;cursor:pointer";
function toolbar() {
  bar.innerHTML = "";
  const b = (label, title, fn) => { const x = document.createElement("button"); x.textContent = label; x.title = title;
    x.style.cssText = btnCss; x.onclick = () => { fn(); sync(); }; bar.appendChild(x); };
  b(topView ? "◉ Top-down" : "◎ Orbit", "T: switch between the orbiting view and straight down at the cards", () => (topView = !topView));
  b(showAvatars ? "Avatars: on" : "Avatars: off", "A: show or hide the avatars", () => (showAvatars = !showAvatars));
  const a = document.createElement("a"); a.href = "/board"; a.textContent = "2D board ↗"; a.title = "the whole board without 3D";
  a.style.cssText = btnCss + ";text-decoration:none"; bar.appendChild(a);
}
function sync() {
  const q = new URLSearchParams(location.search);
  topView ? q.set("view", "top") : q.delete("view"); showAvatars ? q.delete("avatars") : q.set("avatars", "off");
  history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : ""));
  toolbar();
}
toolbar();
renderer.xr.addEventListener("sessionstart", () => (bar.style.display = "none"));
renderer.xr.addEventListener("sessionend", () => (bar.style.display = "flex"));
addEventListener("keydown", ev => {
  if (ev.key === "t" || ev.key === "T") { topView = !topView; sync(); }
  if (ev.key === "a" || ev.key === "A") { showAvatars = !showAvatars; sync(); }
});

await build(); phase(); poll(); boardRefresh();
setInterval(phase, 1500); setInterval(boardRefresh, 2500);
</script>
