<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Magnet head on the X carriage: bracket, swivel bolt, spring, wing nut, printed swivel, electromagnet</title>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#1a1a1a">3 · Magnet head (side view)</text>
  <rect x="90" y="80" width="200" height="90" rx="6" fill="#e3e3e3" stroke="#333" stroke-width="2"/>
  <text x="190" y="130" text-anchor="middle" fill="#1a1a1a" font-weight="700">X carriage / hotend cover</text>
  <text x="300" y="104" fill="#555" font-size="12">the hotend stays cold: gantry.py never sends a heater command</text>
  <path d="M120 170 L140 170 L140 250 L330 250 L330 266 L120 266 Z" fill="#cfcfcf" stroke="#444" stroke-width="2"/>
  <rect x="112" y="176" width="8" height="70" fill="#e85d75"/>
  <text x="350" y="236" fill="#1a1a1a">3" aluminium angle: mounting tape + zip ties to the carriage</text>
  <!-- wing nut + spring above bracket -->
  <path d="M250 200 L300 200 L292 214 L258 214 Z" fill="#7d7d7d"/>
  <text x="350" y="208" fill="#1a1a1a">wing nut: sets the swivel's drag</text>
  <path d="M262 216 l26 6 l-26 6 l26 6 l-26 6 l26 6" fill="none" stroke="#b07a2e" stroke-width="3"/>
  <text x="350" y="182" fill="#b07a2e" font-size="12">spring (from the assortment)</text>
  <rect x="270" y="196" width="10" height="110" fill="#9a9a9a"/>
  <text x="24" y="292" fill="#555" font-size="12">1/4"-20 bolt turns in the bracket's hole</text>
  <!-- nylon washer -->
  <rect x="252" y="266" width="46" height="8" fill="#f3efe0" stroke="#999"/>
  <text x="350" y="276" fill="#1a1a1a" font-size="12">nylon spacer, cut to ~6 mm: low-friction washer</text>
  <!-- swivel -->
  <rect x="240" y="274" width="70" height="56" rx="6" fill="#e9c46a" stroke="#8a6d1f" stroke-width="2"/>
  <rect x="258" y="296" width="34" height="12" fill="#6d6d6d"/>
  <text x="350" y="304" fill="#1a1a1a">printed swivel: the bolt's head sits in a sideways hex slot</text>
  <rect x="270" y="314" width="10" height="20" fill="#444"/>
  <text x="350" y="326" fill="#1a1a1a" font-size="12">M3 × 6 mm screw down through the floor into the magnet</text>
  <!-- magnet -->
  <rect x="245" y="332" width="60" height="40" rx="4" fill="#b23a48"/>
  <text x="350" y="366" fill="#b23a48" font-weight="700">24 V electromagnet, 20 × 15 mm: the lowest point of the head</text>
  <path d="M305 360 C 330 400, 420 410, 470 404" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="480" y="408" fill="#c0392b" font-size="12">leads → part-fan connector (Step 5)</text>
  <!-- card with disc -->
  <rect x="190" y="420" width="170" height="10" fill="#f4f4f4" stroke="#777"/>
  <rect x="262" y="414" width="26" height="5" fill="#8e9aa6"/>
  <text x="190" y="452" fill="#1a1a1a" font-size="12">the AI's card: a steel disc behind it, inside the sleeve</text>
  <rect x="560" y="470" width="370" height="104" rx="8" fill="#eaf6f4" stroke="#2a9d8f"/>
  <text x="574" y="494" font-weight="700" fill="#145c53">Clearance rule</text>
  <text x="574" y="516" fill="#145c53" font-size="12">The magnet's face must sit at least 5 mm below the nozzle</text>
  <text x="574" y="534" fill="#145c53" font-size="12">and below anything else on the carriage. Measure it and set</text>
  <text x="574" y="552" fill="#145c53" font-size="12">min_z in table/.cache/gantry.json before the first move.</text>
</svg>
