<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Camera gantry overview: CR-6 Max with the Canon on the X beam and the suction head on the carriage</title>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#1a1a1a">1 · The whole rig (front view, not to scale)</text>
  <!-- base and bed -->
  <rect x="150" y="500" width="560" height="40" rx="4" fill="#3b3b3b"/>
  <text x="430" y="526" text-anchor="middle" fill="#fff">CR-6 Max base</text>
  <rect x="190" y="470" width="480" height="22" rx="3" fill="#9a9a9a"/>
  <text x="430" y="486" text-anchor="middle" fill="#111">bed (moves in Y, toward / away from you) — cards lie here</text>
  <g fill="#ffffff" stroke="#555" stroke-width="1">
    <rect x="230" y="455" width="40" height="14"/><rect x="280" y="455" width="40" height="14"/><rect x="330" y="455" width="40" height="14"/>
    <rect x="520" y="455" width="40" height="14"/><rect x="570" y="455" width="40" height="14"/>
  </g>
  <!-- uprights -->
  <rect x="170" y="90" width="26" height="410" fill="#5a5a5a"/>
  <rect x="664" y="90" width="26" height="410" fill="#5a5a5a"/>
  <text x="200" y="84" fill="#333">Z upright</text>
  <!-- X beam -->
  <rect x="170" y="200" width="520" height="34" rx="3" fill="#2f6fb0"/>
  <text x="378" y="222" text-anchor="middle" fill="#fff" font-weight="700">X beam (moves in Z)</text>
  <!-- camera on beam (fixed) -->
  <rect x="226" y="166" width="60" height="34" fill="#c9c9c9" stroke="#333"/>
  <text x="256" y="160" text-anchor="middle" fill="#1a1a1a" font-size="12">aluminium angle</text>
  <circle cx="256" cy="244" r="10" fill="#222"/>
  <text x="300" y="258" fill="#1a1a1a" font-size="12">ball head</text>
  <rect x="216" y="254" width="80" height="58" rx="8" fill="#1d1d1d"/>
  <text x="256" y="288" text-anchor="middle" fill="#fff" font-size="13">Canon T5i</text>
  <rect x="236" y="312" width="40" height="44" rx="4" fill="#333"/>
  <text x="256" y="372" text-anchor="middle" fill="#1a1a1a" font-size="12">lens points down</text>
  <path d="M236 356 L190 452 L330 452 L276 356 Z" fill="#f5c542" opacity="0.25"/>
  <!-- carriage + suction head -->
  <rect x="470" y="190" width="84" height="54" rx="4" fill="#e3e3e3" stroke="#333"/>
  <text x="512" y="182" text-anchor="middle" fill="#1a1a1a" font-size="12">X carriage (moves left / right)</text>
  <rect x="490" y="244" width="44" height="30" fill="#4a7bd0" stroke="#223"/>
  <text x="560" y="262" fill="#1a1a1a" font-size="12">MG90S servo</text>
  <rect x="508" y="274" width="8" height="120" fill="#888"/>
  <path d="M496 394 L528 394 L522 418 L502 418 Z" fill="#d5492f"/>
  <text x="490" y="410" text-anchor="end" fill="#d5492f" font-weight="700" font-size="13">lowest point: the suction cup</text>
  <!-- tube -->
  <path d="M520 300 C 640 300, 760 330, 790 380" fill="none" stroke="#2a9d8f" stroke-width="4"/>
  <!-- control box -->
  <rect x="740" y="380" width="190" height="140" rx="8" fill="#f2f2f2" stroke="#333"/>
  <text x="835" y="402" text-anchor="middle" font-weight="700" fill="#1a1a1a">control box</text>
  <text x="752" y="426" fill="#1a1a1a" font-size="12">vacuum pump + valve</text>
  <text x="752" y="446" fill="#1a1a1a" font-size="12">2 × MOSFET module</text>
  <text x="752" y="466" fill="#1a1a1a" font-size="12">Arduino Nano · 5 V buck</text>
  <text x="752" y="486" fill="#1a1a1a" font-size="12">12 V 2 A power supply</text>
  <text x="790" y="372" fill="#2a9d8f" font-size="12">4 mm vacuum tube</text>
  <!-- laptop -->
  <rect x="770" y="90" width="150" height="90" rx="6" fill="#1f2a33"/>
  <text x="845" y="140" text-anchor="middle" fill="#fff">Mac (table server)</text>
  <g stroke="#8e44ad" stroke-width="3" fill="none">
    <path d="M216 290 L140 290 L140 60 L840 60 L840 90"/>
    <path d="M690 230 C 730 200, 760 170, 770 160"/>
    <path d="M835 380 L 845 180"/>
  </g>
  <text x="420" y="54" fill="#8e44ad" font-size="12">USB: Canon (photos), along the left upright</text>
  <text x="700" y="215" fill="#8e44ad" font-size="12">USB: printer</text>
  <text x="850" y="290" fill="#8e44ad" font-size="12">USB: Nano</text>
  <text x="24" y="590" fill="#555" font-size="13">The printer only moves things. It never heats or extrudes (table/gantry.py refuses those commands).</text>
</svg>
