<text x="300.0" y="652.0" font-size="12" text-anchor="middle" font-weight="700" fill="#555">FRONT: the person sits here</text>
<text x="578.0" y="100.0" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1a">Hand rack (back edge)</text>
<text x="578.0" y="118.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">seven slots, numbered 0–6; grey dot = the washer</text>
<text x="578.0" y="134.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">each card slides out to the left, then lifts</text>
<text x="578.0" y="150.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">fence on the person's side hides the faces</text>
<text x="578.0" y="230.0" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1a">Battlefield (dashed)</text>
<text x="578.0" y="248.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">about ten card spots, 400 × 260 mm</text>
<text x="578.0" y="264.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">black dot, bottom right: the tap station</text>
<text x="578.0" y="280.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">(a rubber washer glued to the bed)</text>
<text x="578.0" y="370.0" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1a">Discard chute (front left)</text>
<text x="578.0" y="388.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">hooks over the front edge; cards slide</text>
<text x="578.0" y="404.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">off into a tray on the table below</text>
<text x="578.0" y="460.0" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1a">Deck box (front right)</text>
<text x="578.0" y="478.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">face-up deck under its lid; the magnet</text>
<text x="578.0" y="494.0" font-size="13" text-anchor="start" font-weight="400" fill="#333">slides the top card out of the open strip</text>
<text x="24.0" y="688.0" font-size="12" text-anchor="start" font-weight="400" fill="#555">The bed moves toward / away from you (Y); the magnet head moves left / right (X). Keep people's cards off the bed.</text>
</svg>
