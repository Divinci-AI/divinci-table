<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Wiring: 12 V supply, two MOSFET modules, pump, valve, 5 V buck, servo, Arduino Nano</title>
  <rect width="980" height="640" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#1a1a1a">5 · Wiring (unplug the 12 V supply while wiring)</text>
  <!-- PSU -->
  <rect x="30" y="80" width="150" height="90" rx="8" fill="#333"/>
  <text x="105" y="118" text-anchor="middle" fill="#fff" font-weight="700">12 V 2 A supply</text>
  <text x="105" y="138" text-anchor="middle" fill="#ccc">screw-terminal plug</text>
  <circle cx="180" cy="100" r="6" fill="#d62828"/><text x="190" y="96" fill="#d62828">+12 V</text>
  <circle cx="180" cy="150" r="6" fill="#111"/><text x="190" y="166" fill="#111">GND</text>
  <!-- rails -->
  <path d="M186 100 L940 100" stroke="#d62828" stroke-width="4"/>
  <path d="M186 150 L940 150" stroke="#111" stroke-width="4"/>
  <text x="840" y="92" fill="#d62828">+12 V rail</text><text x="760" y="170" fill="#111">GND rail (shared)</text>
  <!-- MOSFET A -->
  <rect x="250" y="220" width="160" height="110" rx="6" fill="#1f6feb"/>
  <text x="330" y="246" text-anchor="middle" fill="#fff" font-weight="700">MOSFET module A</text>
  <text x="330" y="266" text-anchor="middle" fill="#dbe8ff">VIN+ / VIN− from rails</text>
  <text x="330" y="284" text-anchor="middle" fill="#dbe8ff">OUT+ / OUT− → pump</text>
  <text x="330" y="302" text-anchor="middle" fill="#dbe8ff">TRIG/PWM ← Nano D5</text>
  <path d="M290 100 L290 220" stroke="#d62828" stroke-width="3"/><path d="M370 150 L370 220" stroke="#111" stroke-width="3"/>
  <!-- MOSFET B -->
  <rect x="460" y="220" width="160" height="110" rx="6" fill="#1f6feb"/>
  <text x="540" y="246" text-anchor="middle" fill="#fff" font-weight="700">MOSFET module B</text>
  <text x="540" y="266" text-anchor="middle" fill="#dbe8ff">VIN+ / VIN− from rails</text>
  <text x="540" y="284" text-anchor="middle" fill="#dbe8ff">OUT+ / OUT− → valve</text>
  <text x="540" y="302" text-anchor="middle" fill="#dbe8ff">TRIG/PWM ← Nano D6</text>
  <path d="M500 100 L500 220" stroke="#d62828" stroke-width="3"/><path d="M580 150 L580 220" stroke="#111" stroke-width="3"/>
  <!-- buck -->
  <rect x="680" y="220" width="160" height="110" rx="6" fill="#2a9d8f"/>
  <text x="760" y="246" text-anchor="middle" fill="#fff" font-weight="700">5 V buck converter</text>
  <text x="760" y="266" text-anchor="middle" fill="#e6fffb">IN: 12 V rails</text>
  <text x="760" y="284" text-anchor="middle" fill="#e6fffb">OUT: 5 V → servo only</text>
  <text x="760" y="302" text-anchor="middle" fill="#e6fffb">(measure 5 V first!)</text>
  <path d="M720 100 L720 220" stroke="#d62828" stroke-width="3"/><path d="M800 150 L800 220" stroke="#111" stroke-width="3"/>
  <!-- loads -->
  <rect x="250" y="400" width="160" height="70" rx="8" fill="#3d5a80"/><text x="330" y="440" text-anchor="middle" fill="#fff" font-weight="700">vacuum pump</text>
  <path d="M300 330 L300 400" stroke="#d62828" stroke-width="3"/><path d="M360 330 L360 400" stroke="#111" stroke-width="3"/>
  <rect x="460" y="400" width="160" height="70" rx="8" fill="#6c757d"/><text x="540" y="440" text-anchor="middle" fill="#fff" font-weight="700">solenoid valve</text>
  <path d="M510 330 L510 400" stroke="#d62828" stroke-width="3"/><path d="M570 330 L570 400" stroke="#111" stroke-width="3"/>
  <!-- diodes -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <path d="M318 360 L342 360 L330 378 Z"/><path d="M528 360 L552 360 L540 378 Z"/>
  </g>
  <path d="M318 380 L342 380" stroke="#111" stroke-width="3"/><path d="M528 380 L552 380" stroke="#111" stroke-width="3"/>
  <text x="250" y="496" fill="#b00020" font-size="12">1N4007 across each coil: stripe (cathode) to +, other end to −</text>
  <!-- servo -->
  <rect x="680" y="400" width="160" height="70" rx="8" fill="#4a7bd0"/><text x="760" y="432" text-anchor="middle" fill="#fff" font-weight="700">MG90S servo</text>
  <text x="760" y="452" text-anchor="middle" fill="#e8f0ff" font-size="11">red 5V · brown GND</text><text x="760" y="465" text-anchor="middle" fill="#e8f0ff" font-size="11">orange = signal</text>
  <path d="M730 330 L730 400" stroke="#e76f51" stroke-width="3"/><path d="M790 330 L790 400" stroke="#111" stroke-width="3"/>
  <!-- nano -->
  <rect x="30" y="520" width="520" height="90" rx="8" fill="#00878f"/>
  <text x="290" y="548" text-anchor="middle" fill="#fff" font-weight="700">Arduino Nano (USB-C to the Mac — powered by USB)</text>
  <text x="290" y="570" text-anchor="middle" fill="#e6fffb">D5 → module A TRIG · D6 → module B TRIG · D9 → servo orange</text>
  <text x="290" y="592" text-anchor="middle" fill="#e6fffb">GND → GND rail (one shared ground, or the signals mean nothing)</text>
  <path d="M600 560 L940 560 L940 150" stroke="#111" stroke-width="3" fill="none"/>
  <text x="610" y="552" fill="#111">Nano GND to the rail</text>
  <path d="M560 540 Q 860 520 840 470" stroke="#f4a261" stroke-width="3" fill="none"/>
  <text x="604" y="514" fill="#b5651d">D9 signal</text>
</svg>
