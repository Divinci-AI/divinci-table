<title>Jev at the Commander Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b1f26; --muted:#5d6572; --line:#d5dae2; --soft:#e6eaef;
  --brass:#9a7530; --brass-soft:#f1e6cf;
  --U:#2f6db5; --B:#5b4a6e; --R:#c0432f; --G:#3d7d3c;
  --dead:#a3a9b3;
  --serif:"Alegreya SC", "Palatino Linotype", Palatino, Georgia, serif;
  --sans:"Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121418; --panel:#1b1e24; --ink:#e7eaef; --muted:#9aa2ae; --line:#2e333b; --soft:#252a31;
    --brass:#d6b066; --brass-soft:#3a3122;
    --U:#6aa0e6; --B:#a996c4; --R:#ea7a62; --G:#7cbf6f; --dead:#5b616b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121418; --panel:#1b1e24; --ink:#e7eaef; --muted:#9aa2ae; --line:#2e333b; --soft:#252a31;
  --brass:#d6b066; --brass-soft:#3a3122;
  --U:#6aa0e6; --B:#a996c4; --R:#ea7a62; --G:#7cbf6f; --dead:#5b616b;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font:16px/1.45 var(--sans); padding-inline:16px; padding-block:0 40px}
.wrap{max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
header.top{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 18px; padding-top:20px}
h1{font:700 1.7rem/1.1 var(--serif); margin:0; letter-spacing:.01em; text-wrap:balance}
.sub{color:var(--muted); margin:0; max-width:70ch}
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:10px;
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; border-bottom:1px solid var(--line)}
select,button{font:500 .95rem var(--sans); color:var(--ink); background:var(--panel); border:1px solid var(--line);
  border-radius:6px; padding:6px 10px; cursor:pointer}
button:hover,select:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
button.primary{background:var(--ink); color:var(--bg); border-color:var(--ink); min-width:74px}
#scrub{flex:1 1 200px; accent-color:var(--brass)}
.stepno{font:400 .85rem var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; min-width:9ch}
label.tog{display:flex; gap:6px; align-items:center; color:var(--muted); font-size:.92rem; cursor:pointer}
.meta{display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--muted); font-size:.92rem}
.meta b{color:var(--ink); font-weight:600}

.main{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:860px){ .main{grid-template-columns:1fr} }

.table{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:520px){ .table{grid-template-columns:1fr} }
.seat{background:var(--panel); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:8px;
  padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-height:170px}
.seat.active{box-shadow:0 0 0 2px var(--c)}
.seat.dead{opacity:.5; filter:grayscale(.7)}
.seat .head{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.seat .name{font:700 1.05rem/1.15 var(--serif); color:var(--c)}
.seat .agent{font:600 .72rem var(--mono); letter-spacing:.06em; text-transform:uppercase; padding:2px 6px;
  border-radius:4px; background:var(--soft); color:var(--muted); white-space:nowrap}
.seat .agent.model{background:var(--brass-soft); color:var(--brass)}
.life{display:flex; align-items:baseline; gap:10px}
.life .n{font:600 2rem/1 var(--mono); font-variant-numeric:tabular-nums}
.life .lbl{font-size:.8rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.facts{font:400 .8rem var(--mono); color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 12px}
.board{display:flex; flex-wrap:wrap; gap:4px}
.chip{font:500 .78rem/1.2 var(--sans); padding:2px 7px; border-radius:4px; border:1px solid var(--line); background:var(--bg)}
.chip.tapped{opacity:.55; font-style:italic}
.chip.cmd{border-color:var(--c); color:var(--c); font-weight:700}
.chip .pt{font-family:var(--mono); margin-left:4px}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; display:flex; flex-direction:column; gap:12px}
.panel h2{font:700 1rem var(--serif); margin:0; letter-spacing:.02em}
.eyebrow{font:600 .72rem var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.prompt{margin:0; color:var(--ink)}
.q{display:flex; flex-direction:column; gap:6px; padding-top:10px; border-top:1px solid var(--line)}
.q:first-of-type{border-top:0; padding-top:0}
.opt{display:grid; grid-template-columns:minmax(0,1fr) 88px 50px; gap:8px; align-items:center; font-size:.9rem}
.opt .k{overflow-wrap:anywhere}
.opt.win .k{font-weight:700}
.track{height:8px; background:var(--soft); border-radius:4px; overflow:hidden}
.track i{display:block; height:100%; background:var(--muted)}
.opt.win .track i{background:var(--brass)}
.opt .p{font:400 .82rem var(--mono); text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}
.opt.win .p{color:var(--ink); font-weight:600}
.note{font-size:.88rem; color:var(--muted); margin:0}
.fallback{font-size:.85rem; color:var(--R); margin:0}
.threats{display:flex; flex-direction:column; gap:6px}
.threat{display:grid; grid-template-columns:minmax(0,1fr) 110px 40px; gap:8px; align-items:center; font-size:.88rem}
.threat .track i{background:var(--c)}

.log{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 16px}
.log ol{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:3px; max-height:320px; overflow:auto}
.log li{font-size:.9rem; color:var(--muted); padding-left:10px; border-left:2px solid transparent}
.log li.now{color:var(--ink); border-left-color:var(--brass)}
.log li.elim{color:var(--R); font-weight:600}
.foot{font-size:.85rem; color:var(--muted); max-width:80ch}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="wrap">
  <header class="top">
    <h1>Jev at the Commander Table</h1>
    <p class="sub">Replays of four-player Commander games. The engine lists the legal moves; the model in a seat picks one. Bars show the probability it gave each option.</p>
  </header>

  <div class="bar" role="toolbar" aria-label="Replay controls">
    <select id="game" aria-label="Game"></select>
    <button id="prev" aria-label="Previous step">◀</button>
    <button id="play" class="primary">Play</button>
    <button id="next" aria-label="Next step">▶</button>
    <input id="scrub" type="range" min="0" value="0" aria-label="Step">
    <span class="stepno" id="stepno"></span>
    <label class="tog"><input type="checkbox" id="onlyModel" checked> Model decisions only</label>
  </div>

  <div class="meta" id="meta"></div>

  <div class="main">
    <section class="table" id="table" aria-label="Players"></section>
    <section class="panel" id="decision" aria-live="polite"></section>
  </div>

  <section class="log" aria-label="Game log">
    <div class="eyebrow">Game log</div>
    <ol id="log"></ol>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script type="application/json" id="data">__GAMES__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const COL = {U:"var(--U)",B:"var(--B)",R:"var(--R)",G:"var(--G)"};
const MODEL = new Set(["jev","djev","so1"]);
const $ = id => document.getElementById(id);
let g = null, steps = [], idx = 0, timer = null;

DATA.games.forEach((gm,i)=>{
  const o=document.createElement("option"); o.value=i; o.textContent=gm.title; $("game").appendChild(o);
});
$("foot").textContent = DATA.footnote;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pretty(label){return String(label).replace(/#\d+/g,"")}

function load(i){
  g = DATA.games[i];
  const only = $("onlyModel").checked;
  steps = g.log.map((e,j)=>j).filter(j=>{
    const e=g.log[j];
    return !only || (e.t==="decision" && MODEL.has(e.agent)) || /wins|eliminated|Round cap|draw\./.test(e.text||"");
  });
  if(!steps.length) steps = g.log.map((e,j)=>j);
  $("scrub").max = steps.length-1;
  idx = 0; render();
  const w = g.winner==null ? "no winner" : `${g.seatNames[g.winner]} won`;
  $("meta").innerHTML = `<span>Seed <b>${g.seed}</b></span><span><b>${esc(w)}</b> after ${g.rounds} rounds</span>`+
    `<span>${g.log.filter(e=>e.t==="decision"&&MODEL.has(e.agent)).length} model decisions</span>`;
}

function snapAt(j){ for(let k=j;k>=0;k--) if(g.log[k].snap) return g.log[k].snap; return null; }

function renderTable(snap, cur){
  const t=$("table"); t.innerHTML="";
  snap.players.forEach((p,s)=>{
    const c=COL[g.colours[s]], agent=g.seats[s];
    const board=p.board.filter(x=>x.kind!=="land");
    const lands=p.board.filter(x=>x.kind==="land").length;
    const cd=Object.entries(p.cmdr_damage_taken||{}).map(([k,v])=>`${v} cmdr dmg from seat ${+k+1}`);
    const el=document.createElement("article");
    el.className="seat"+(snap.active===s?" active":"")+(p.alive?"":" dead");
    el.style.setProperty("--c",c);
    el.innerHTML=`<div class="head"><span class="name">${esc(p.name)}</span>
      <span class="agent ${MODEL.has(agent)?"model":""}">${esc(agent)}</span></div>
      <div class="life"><span class="n">${p.alive?p.life:"—"}</span><span class="lbl">${p.alive?"life":"eliminated"}</span></div>
      <div class="facts"><span>${lands} lands</span><span>hand ${p.hand}</span><span>library ${p.library}</span>
      ${p.cmdr_in_zone?`<span>commander in zone (tax ${p.tax})</span>`:""}${cd.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
      <div class="board">${board.map(x=>`<span class="chip ${x.tapped?"tapped":""} ${x.commander?"cmd":""}">${esc(x.name.split(",")[0])}${x.pt?`<span class="pt">${x.pt[0]}/${x.pt[1]}</span>`:""}</span>`).join("")||`<span class="note">No creatures or artifacts</span>`}</div>`;
    t.appendChild(el);
  });
}

function renderDecision(e){
  const d=$("decision");
  if(e.t!=="decision"){
    d.innerHTML=`<div class="eyebrow">Event</div><h2>${esc(e.text)}</h2>`; return;
  }
  const who = g.seatNames[e.seat];
  let html=`<div class="eyebrow">${esc(e.agent)} · ${esc(e.kind)} decision · ${e.ms?e.ms+" ms":"local"}</div><h2>${esc(who)}</h2>`;
  if(e.fallback) html+=`<p class="fallback">Heuristic fallback used: ${esc(e.fallback)}</p>`;
  e.questions.forEach(q=>{
    const a=(e.answers||{})[q.id];
    html+=`<div class="q"><p class="prompt">${esc(pretty(q.prompt))}</p>`;
    if(a){
      const probs=q.options.map(k=>[k,a.probs[k]]);
      probs.sort((x,y)=>(y[1]??-1)-(x[1]??-1));
      probs.forEach(([k,p])=>{
        const win=k===a.choice;
        html+=`<div class="opt ${win?"win":""}"><span class="k">${esc(pretty(k))}</span>
          <span class="track"><i style="width:${p==null?0:Math.round(p*100)}%"></i></span>
          <span class="p">${p==null?"—":(p*100).toFixed(p<.1?1:0)+"%"}</span></div>`;
      });
    } else {
      html+=`<p class="note">${q.options.length} options; decided by the ${esc(e.agent)} policy (no probabilities).</p>`;
    }
    html+=`</div>`;
  });
  if(e.threat && Object.keys(e.threat).length){
    html+=`<div class="q"><div class="eyebrow">Threat read (0 = no threat, 100 = about to win)</div><div class="threats">`;
    Object.entries(e.threat).forEach(([s,v])=>{
      html+=`<div class="threat" style="--c:${COL[g.colours[s]]}"><span>${esc(g.seatNames[s])}</span>
        <span class="track"><i style="width:${Math.round(v*100)}%"></i></span><span class="p">${Math.round(v*100)}</span></div>`;
    });
    html+=`</div></div>`;
  }
  d.innerHTML=html;
}

function renderLog(j){
  const ol=$("log"); ol.innerHTML="";
  const ev=[]; for(let k=0;k<=j;k++) if(g.log[k].t==="event") ev.push(g.log[k].text);
  ev.slice(-40).forEach((t,i,arr)=>{
    const li=document.createElement("li"); li.textContent=t;
    if(i===arr.length-1) li.className="now";
    if(t.startsWith("☠")) li.className+=" elim";
    ol.appendChild(li);
  });
  ol.scrollTop=ol.scrollHeight;
}

function render(){
  const j=steps[idx], e=g.log[j];
  const snap=snapAt(j);
  if(snap) renderTable(snap);
  renderDecision(e); renderLog(j);
  $("scrub").value=idx;
  $("stepno").textContent=`${idx+1} / ${steps.length}`;
}
function go(n){ idx=Math.max(0,Math.min(steps.length-1,n)); render(); }
function stop(){ clearInterval(timer); timer=null; $("play").textContent="Play"; }
$("prev").onclick=()=>{stop();go(idx-1)};
$("next").onclick=()=>{stop();go(idx+1)};
$("scrub").oninput=ev=>{stop();go(+ev.target.value)};
$("play").onclick=()=>{
  if(timer){stop();return}
  $("play").textContent="Pause";
  timer=setInterval(()=>{ if(idx>=steps.length-1) stop(); else go(idx+1); }, 1100);
};
$("game").onchange=ev=>{stop();load(+ev.target.value)};
$("onlyModel").onchange=()=>{stop();load(+$("game").value)};
document.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="SELECT"||ev.target.tagName==="INPUT") return;
  if(ev.key==="ArrowRight"){stop();go(idx+1)} else if(ev.key==="ArrowLeft"){stop();go(idx-1)}
});
load(0);
</script>
